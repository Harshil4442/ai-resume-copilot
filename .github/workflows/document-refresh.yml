name: Document definitions maintenance

on:
  schedule:
    - cron: "17 * * * *"
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Audit expiry or execute reviewed CVD-only maintenance
        type: choice
        options: [monitor, refresh]
        default: monitor

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: hirewiz-document-definitions-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.repository == 'Harshil4442/ai-resume-copilot' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: document-maintenance
    env:
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: "true"
      CLOUDSDK_CORE_LOG_HTTP: "false"
      REFRESH_MODE: ${{ github.event.schedule == '37 1 * * *' && 'refresh' || inputs.mode || 'monitor' }}
      DOCUMENT_REFRESH_CONTROLLER_UID: ${{ vars.DOCUMENT_REFRESH_CONTROLLER_UID }}
      HISTORY_DIRECTORY: ${{ runner.temp }}/document-refresh-history
      OUTPUT_DIRECTORY: ${{ runner.temp }}/document-refresh-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require explicitly provisioned maintenance identity
        env:
          PROVIDER: ${{ vars.DOCUMENT_REFRESH_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.DOCUMENT_REFRESH_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" && test "$ACCOUNT" = "hirewiz-document-refresh@ai-resume-parser-482412.iam.gserviceaccount.com"
          test -n "$DOCUMENT_REFRESH_CONTROLLER_UID"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DOCUMENT_REFRESH_WIF_PROVIDER }}
          service_account: ${{ vars.DOCUMENT_REFRESH_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked checker runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --project backend --frozen --all-groups
      - name: Configure registry credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Audit serving expiry
        if: env.REFRESH_MODE == 'monitor'
        run: backend/.venv/bin/python backend/scripts/document_refresh.py --mode monitor --output-directory "$OUTPUT_DIRECTORY"
      - name: Retrieve prior owned native proof journals
        if: env.REFRESH_MODE == 'refresh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -m 700 "$HISTORY_DIRECTORY"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | startswith("document-refresh-refresh-"))) | [.workflow_run.id, .id, .name, .workflow_run.head_branch] | @tsv' > "$RUNNER_TEMP/document-refresh-artifacts.tsv"
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"document-refresh-artifacts.tsv"; rows=[r for r in p.read_text().splitlines() if r.split("\t")[-1]==os.environ["GITHUB_REF_NAME"]]; p.write_text("\n".join(rows[:3]) + "\n")'
          while IFS=$'\t' read -r run artifact_id artifact branch; do
            test -n "$run" || continue
            gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$HISTORY_DIRECTORY/$artifact_id"
          done < "$RUNNER_TEMP/document-refresh-artifacts.tsv"
          find "$HISTORY_DIRECTORY" -type d -exec chmod 700 {} +
          find "$HISTORY_DIRECTORY" -type f -exec chmod 600 {} +
      - name: Build, prove, transition exact pins and restore admission
        if: env.REFRESH_MODE == 'refresh'
        run: backend/.venv/bin/python backend/scripts/document_refresh.py --mode refresh --publish-candidate --prior-history-directory "$HISTORY_DIRECTORY" --output-directory "$OUTPUT_DIRECTORY"
      - name: Retain bounded maintenance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-refresh-${{ env.REFRESH_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIRECTORY }}/**/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Surface required action
        if: always()
        run: |
          echo '### Document definition maintenance' >> "$GITHUB_STEP_SUMMARY"
          echo 'Refresh requires actual native six-case acceptance before the bounded fail-closed worker and three-caller pin transition. On failure retain this journal, inspect the same native operation, and keep admission closed; rerunning a failed POST/PATCH is not recovery. Monitor emits an expiry heartbeat for the configured Cloud Monitoring alert.' >> "$GITHUB_STEP_SUMMARY"
