name: Document definitions maintenance

on:
  schedule:
    - cron: "17,47 * * * *"
    - cron: "37 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Audit expiry or execute reviewed definition/full-source maintenance
        type: choice
        options: [monitor, refresh, full-source-refresh, resume-full-source-refresh, resume-expired-v2-transition, resume-partial-v2-transition, resume-final-v2-transition, reconcile-final-v2-transition, audit-consumed-v2-history]
        default: monitor
      source_revision:
        description: Build current committed source and require new V4 native reading-order acceptance
        type: boolean
        default: false
      resume_completed_source_readback:
        description: Continue only the exact completed 41108319542 source jobs without another Build or Job
        type: boolean
        default: false
      recover_failed_native_job:
        description: Exact failed synthetic Job to reconcile once before a fresh full refresh
        type: string
        required: false
        default: ""
      retire_expired_v2:
        description: Explicitly retire an expired V2 worker after closing all callers and proving a fresh V3 successor
        type: boolean
        default: false
      rescue_expired_v2:
        description: Explicitly replace the exact expired V2 worker after the guarded API hotfix is serving
        type: boolean
        default: false
      upgrade_current_v2_to_v3:
        description: Explicitly upgrade a freshly verified V2 worker through fresh V3 inventory and eleven-case native proof
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write
  actions: read

concurrency:
  group: hirewiz-document-definitions-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    if: github.repository == 'Harshil4442/ai-resume-copilot' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: document-maintenance
    env:
      CLOUDSDK_CORE_DISABLE_FILE_LOGGING: "true"
      CLOUDSDK_CORE_LOG_HTTP: "false"
      REFRESH_MODE: ${{ github.event.schedule == '37 1 * * *' && 'refresh' || inputs.mode || 'monitor' }}
      DOCUMENT_REFRESH_CONTROLLER_UID: ${{ vars.DOCUMENT_REFRESH_CONTROLLER_UID }}
      RECOVER_FAILED_NATIVE_JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_failed_native_job || '' }}
      RETIRE_EXPIRED_V2: ${{ github.event_name == 'workflow_dispatch' && inputs.retire_expired_v2 || false }}
      RESCUE_EXPIRED_V2: ${{ github.event_name == 'workflow_dispatch' && inputs.rescue_expired_v2 || false }}
      UPGRADE_CURRENT_V2_TO_V3: ${{ github.event_name == 'workflow_dispatch' && inputs.upgrade_current_v2_to_v3 || false }}
      SOURCE_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.source_revision || false }}
      RESUME_COMPLETED_SOURCE_READBACK: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_completed_source_readback || false }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Initialize private maintenance paths
        run: |
          umask 077
          printf '%s\n' "RESUME_DIRECTORY=$RUNNER_TEMP/document-refresh-original-39901631586" >> "$GITHUB_ENV"
          printf '%s\n' "TRANSITION_DIRECTORY=$RUNNER_TEMP/document-refresh-original-40771705772" >> "$GITHUB_ENV"
          printf '%s\n' "PARTIAL_DIRECTORY=$RUNNER_TEMP/document-refresh-original-40781707554" >> "$GITHUB_ENV"
          printf '%s\n' "FINAL_DIRECTORY=$RUNNER_TEMP/document-refresh-original-40788512340" >> "$GITHUB_ENV"
          printf '%s\n' "READBACK_DIRECTORY=$RUNNER_TEMP/document-refresh-original-40805300453" >> "$GITHUB_ENV"
          printf '%s\n' "HISTORY_DIRECTORY=$RUNNER_TEMP/document-refresh-history" >> "$GITHUB_ENV"
          printf '%s\n' "CONSUMED_BUNDLE=$RUNNER_TEMP/document-refresh-consumed-audit" >> "$GITHUB_ENV"
          printf '%s\n' "COMPLETED_SOURCE_ORIGINAL=$RUNNER_TEMP/completed-source-original-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          printf '%s\n' "OUTPUT_DIRECTORY=$RUNNER_TEMP/document-refresh-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require explicitly provisioned maintenance identity
        env:
          PROVIDER: ${{ vars.DOCUMENT_REFRESH_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.DOCUMENT_REFRESH_SERVICE_ACCOUNT }}
        run: |
          test -n "$PROVIDER" && test "$ACCOUNT" = "hirewiz-document-refresh@ai-resume-parser-482412.iam.gserviceaccount.com"
          test -n "$DOCUMENT_REFRESH_CONTROLLER_UID"
          test "$SOURCE_REVISION" != true || test "$REFRESH_MODE" = full-source-refresh
          test -z "$RECOVER_FAILED_NATIVE_JOB" || test "$REFRESH_MODE" = refresh || test "$REFRESH_MODE" = full-source-refresh
          test "$RETIRE_EXPIRED_V2" != true || test "$REFRESH_MODE" = refresh
          test "$RESCUE_EXPIRED_V2" != true || test "$REFRESH_MODE" = refresh
          test "$RESCUE_EXPIRED_V2" != true || test -z "$RECOVER_FAILED_NATIVE_JOB"
          test "$RETIRE_EXPIRED_V2" != true || test "$RESCUE_EXPIRED_V2" != true
          test "$UPGRADE_CURRENT_V2_TO_V3" != true || { test "$REFRESH_MODE" = refresh && test -z "$RECOVER_FAILED_NATIVE_JOB" && test "$RETIRE_EXPIRED_V2" != true && test "$RESCUE_EXPIRED_V2" != true; }
          test "$RESUME_COMPLETED_SOURCE_READBACK" != true || { test "$REFRESH_MODE" = full-source-refresh && test "$SOURCE_REVISION" = true && test -z "$RECOVER_FAILED_NATIVE_JOB" && test "$RETIRE_EXPIRED_V2" = false && test "$RESCUE_EXPIRED_V2" = false && test "$UPGRADE_CURRENT_V2_TO_V3" = false; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: env.RESUME_COMPLETED_SOURCE_READBACK == 'true'
        with:
          python-version: "3.12"
      - name: Verify completed-source continuation before Google auth
        if: env.RESUME_COMPLETED_SOURCE_READBACK == 'true'
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --project backend --frozen --all-groups
          (cd backend && .venv/bin/pytest -q tests/test_document_source_readback_resume.py)
          backend/.venv/bin/python backend/scripts/resume_completed_document_source.py --mode retrieve --original-directory "$COMPLETED_SOURCE_ORIGINAL"
          backend/.venv/bin/python backend/scripts/resume_completed_document_source.py --mode verify --original-directory "$COMPLETED_SOURCE_ORIGINAL"
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DOCUMENT_REFRESH_WIF_PROVIDER }}
          service_account: ${{ vars.DOCUMENT_REFRESH_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked checker runtime
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --project backend --frozen --all-groups
      - name: Configure registry credential helper
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
      - name: Audit serving expiry
        if: env.REFRESH_MODE == 'monitor'
        run: backend/.venv/bin/python backend/scripts/document_refresh.py --mode monitor --output-directory "$OUTPUT_DIRECTORY"
      - name: Retrieve prior owned native proof journals
        if: env.RESUME_COMPLETED_SOURCE_READBACK != 'true' && (env.REFRESH_MODE == 'refresh' || env.REFRESH_MODE == 'full-source-refresh' || env.REFRESH_MODE == 'resume-full-source-refresh')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -m 700 "$HISTORY_DIRECTORY"
          if [[ "$RESCUE_EXPIRED_V2" = true ]]; then
            # These are exactly the two abandoned pre-native Builds and the
            # currently serving predecessor's owned journal. Do not let later
            # scheduled artifacts evict any of the three from the bounded set.
            while read -r artifact_id run artifact; do
              IFS=$'\t' read -r actual_id actual_run actual_artifact branch expired < <(
                gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" \
                  --jq '[.id, .workflow_run.id, .name, .workflow_run.head_branch, .expired] | @tsv')
              test "$actual_id" = "$artifact_id" && test "$actual_run" = "$run"
              test "$actual_artifact" = "$artifact" && test "$branch" = "$GITHUB_REF_NAME"
              test "$expired" = false
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$HISTORY_DIRECTORY/$artifact_id"
            done <<'RESCUE_ARTIFACTS'
          12716145282 40463057954 document-refresh-refresh-40463057954-1
          12632278735 40282264539 document-refresh-refresh-40282264539-1
          12590585230 40169964119 document-refresh-refresh-40169964119-1
          RESCUE_ARTIFACTS
          else
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name | (startswith("document-refresh-refresh-") or startswith("document-refresh-full-source-refresh-") or startswith("document-refresh-resume-full-source-refresh-")))) | [.workflow_run.id, .id, .name, .workflow_run.head_branch] | @tsv' > "$RUNNER_TEMP/document-refresh-artifacts.tsv"
            python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"document-refresh-artifacts.tsv"; rows=[r for r in p.read_text().splitlines() if r.split("\t")[-1]==os.environ["GITHUB_REF_NAME"]]; p.write_text("\n".join(rows[:3]) + "\n")'
            while IFS=$'\t' read -r run artifact_id artifact branch; do
              test -n "$run" || continue
              gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir "$HISTORY_DIRECTORY/$artifact_id"
            done < "$RUNNER_TEMP/document-refresh-artifacts.tsv"
          fi
          find "$HISTORY_DIRECTORY" -type d -exec chmod 700 {} +
          find "$HISTORY_DIRECTORY" -type f -exec chmod 600 {} +
      - name: Normalize only the exact completed source-readback history
        if: env.RESUME_COMPLETED_SOURCE_READBACK != 'true' && (env.REFRESH_MODE == 'refresh' || env.REFRESH_MODE == 'full-source-refresh' || env.REFRESH_MODE == 'resume-full-source-refresh')
        run: |
          normalized="$RUNNER_TEMP/document-history-normalized-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          selected=$(backend/.venv/bin/python backend/scripts/resume_completed_document_source.py --mode select-history \
            --history-directory "$HISTORY_DIRECTORY" --output-directory "$normalized")
          selected_path=$(printf '%s' "$selected" | python -c 'import json,sys; print(json.load(sys.stdin)["history_directory"])')
          echo "HISTORY_DIRECTORY=$selected_path" >> "$GITHUB_ENV"
      - name: Retrieve exact consumed history for read-only audit when needed
        if: env.REFRESH_MODE == 'audit-consumed-v2-history' || (env.SOURCE_REVISION == 'true' && env.REFRESH_MODE == 'full-source-refresh') || (env.REFRESH_MODE == 'refresh' && env.RETIRE_EXPIRED_V2 != 'true' && env.RESCUE_EXPIRED_V2 != 'true' && env.UPGRADE_CURRENT_V2_TO_V3 != 'true')
        run: |
          args=(--output-directory "$CONSUMED_BUNDLE")
          if [[ "$REFRESH_MODE" = audit-consumed-v2-history || "$RESUME_COMPLETED_SOURCE_READBACK" = true ]]; then
            args+=(--force-audit)
          else
            args+=(--prior-history-directory "$HISTORY_DIRECTORY")
          fi
          backend/.venv/bin/python backend/scripts/retrieve_consumed_document_history.py "${args[@]}"
      - name: Audit consumed V2 history without mutation or heartbeat
        if: env.REFRESH_MODE == 'audit-consumed-v2-history'
        run: backend/.venv/bin/python backend/scripts/document_refresh.py --mode audit-consumed-v2-history --consumed-history-bundle "$CONSUMED_BUNDLE" --output-directory "$OUTPUT_DIRECTORY"
      - name: Retrieve the exact retained already-built candidate
        if: env.REFRESH_MODE == 'resume-full-source-refresh'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -m 700 "$RESUME_DIRECTORY"
          gh run download 39901631586 --repo "$GITHUB_REPOSITORY" --name document-refresh-full-source-refresh-39901631586-1 --dir "$RESUME_DIRECTORY"
          find "$RESUME_DIRECTORY" -type d -exec chmod 700 {} +
          find "$RESUME_DIRECTORY" -type f -exec chmod 600 {} +
      - name: Retrieve the exact failed V2 transition journal
        if: env.REFRESH_MODE == 'resume-expired-v2-transition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          IFS=$'\t' read -r id run artifact branch head digest expired < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12852818465" \
              --jq '[.id, .workflow_run.id, .name, .workflow_run.head_branch, .workflow_run.head_sha, .digest, .expired] | @tsv')
          test "$id" = 12852818465
          test "$run" = 40771705772
          test "$artifact" = document-refresh-refresh-40771705772-1
          test "$branch" = main
          test "$head" = e26c28310ca9fe9abaa9c6c432aacd7790bc5039
          test "$digest" = sha256:39f09c28b9a745041b3052c8604fb1a420622de291ff6b2275fa9b4abdefb144
          test "$expired" = false
          mkdir -m 700 "$TRANSITION_DIRECTORY"
          gh run download 40771705772 --repo "$GITHUB_REPOSITORY" \
            --name document-refresh-refresh-40771705772-1 --dir "$TRANSITION_DIRECTORY"
          find "$TRANSITION_DIRECTORY" -type d -exec chmod 700 {} +
          find "$TRANSITION_DIRECTORY" -type f -exec chmod 600 {} +
      - name: Retrieve the exact partially completed V2 continuation
        if: env.REFRESH_MODE == 'resume-partial-v2-transition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          IFS=$'\t' read -r id run artifact branch head digest expired < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12858021573" \
              --jq '[.id, .workflow_run.id, .name, .workflow_run.head_branch, .workflow_run.head_sha, .digest, .expired] | @tsv')
          test "$id" = 12858021573
          test "$run" = 40781707554
          test "$artifact" = document-refresh-resume-expired-v2-transition-40781707554-1
          test "$branch" = main
          test "$head" = e680b522a12410d597a02a653a0c8cdb9ec5b3ea
          test "$digest" = sha256:e67577ef8f59495554fba9c27c59748d40fb38e80c9c52d61af69fc3b839cde4
          test "$expired" = false
          mkdir -m 700 "$PARTIAL_DIRECTORY"
          gh run download 40781707554 --repo "$GITHUB_REPOSITORY" \
            --name document-refresh-resume-expired-v2-transition-40781707554-1 --dir "$PARTIAL_DIRECTORY"
          find "$PARTIAL_DIRECTORY" -type d -exec chmod 700 {} +
          find "$PARTIAL_DIRECTORY" -type f -exec chmod 600 {} +
      - name: Retrieve the exact failed second V2 continuation
        if: env.REFRESH_MODE == 'resume-final-v2-transition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          IFS=$'\t' read -r id run artifact branch head digest expired < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12860975525" \
              --jq '[.id, .workflow_run.id, .name, .workflow_run.head_branch, .workflow_run.head_sha, .digest, .expired] | @tsv')
          test "$id" = 12860975525
          test "$run" = 40788512340
          test "$artifact" = document-refresh-resume-partial-v2-transition-40788512340-1
          test "$branch" = main
          test "$head" = cbad4abb39017dcf744ede77ce6bfc2826395257
          test "$digest" = sha256:ffe242705f3bc036de6f41e8cfa4a85f2b447804f40ad926d38edc046fafefe3
          test "$expired" = false
          mkdir -m 700 "$FINAL_DIRECTORY"
          gh run download 40788512340 --repo "$GITHUB_REPOSITORY" \
            --name document-refresh-resume-partial-v2-transition-40788512340-1 --dir "$FINAL_DIRECTORY"
          find "$FINAL_DIRECTORY" -type d -exec chmod 700 {} +
          find "$FINAL_DIRECTORY" -type f -exec chmod 600 {} +
      - name: Retrieve the exact acknowledged third continuation for read-only reconciliation
        if: env.REFRESH_MODE == 'reconcile-final-v2-transition'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          IFS=$'\t' read -r id run artifact branch head digest expired < <(
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12868086986" \
              --jq '[.id, .workflow_run.id, .name, .workflow_run.head_branch, .workflow_run.head_sha, .digest, .expired] | @tsv')
          test "$id" = 12868086986
          test "$run" = 40805300453
          test "$artifact" = document-refresh-resume-final-v2-transition-40805300453-1
          test "$branch" = main
          test "$head" = ebee72761f433c43d2e91c9ca61d736631fea8cd
          test "$digest" = sha256:2704e3657731002c1ba008a18cd995d14c227d1a89dbc1f13fb4f03af7df02f6
          test "$expired" = false
          mkdir -m 700 "$READBACK_DIRECTORY"
          gh run download 40805300453 --repo "$GITHUB_REPOSITORY" \
            --name document-refresh-resume-final-v2-transition-40805300453-1 --dir "$READBACK_DIRECTORY"
          find "$READBACK_DIRECTORY" -type d -exec chmod 700 {} +
          find "$READBACK_DIRECTORY" -type f -exec chmod 600 {} +
      - name: Reverify the retained candidate and continue once without a new Build
        if: env.REFRESH_MODE == 'resume-full-source-refresh'
        run: |
          backend/.venv/bin/python backend/scripts/document_refresh.py --mode resume-full-source-refresh --publish-candidate --resume-candidate-directory "$RESUME_DIRECTORY" --resume-manifest-sha256 9d20a0b548b2de03fe61939cd714e697bef42426cd526f1714c598b7d269f5b1 --prior-history-directory "$HISTORY_DIRECTORY" --output-directory "$OUTPUT_DIRECTORY"
      - name: Read back completed closes and continue the exact V2 rescue
        if: env.REFRESH_MODE == 'resume-expired-v2-transition'
        run: |
          backend/.venv/bin/python backend/scripts/document_refresh.py \
            --mode resume-expired-v2-transition \
            --resume-transition-directory "$TRANSITION_DIRECTORY" \
            --output-directory "$OUTPUT_DIRECTORY"
      - name: Reconcile API open and continue only two remaining callers
        if: env.REFRESH_MODE == 'resume-partial-v2-transition'
        run: |
          backend/.venv/bin/python backend/scripts/document_refresh.py \
            --mode resume-partial-v2-transition \
            --resume-transition-directory "$PARTIAL_DIRECTORY" \
            --output-directory "$OUTPUT_DIRECTORY"
      - name: Reconcile analysis open and continue only the coordinator
        if: env.REFRESH_MODE == 'resume-final-v2-transition'
        run: |
          backend/.venv/bin/python backend/scripts/document_refresh.py \
            --mode resume-final-v2-transition \
            --resume-transition-directory "$FINAL_DIRECTORY" \
            --output-directory "$OUTPUT_DIRECTORY"
      - name: Prove the acknowledged coordinator open without another write
        if: env.REFRESH_MODE == 'reconcile-final-v2-transition'
        run: |
          backend/.venv/bin/python backend/scripts/document_refresh.py \
            --mode reconcile-final-v2-transition \
            --resume-transition-directory "$READBACK_DIRECTORY" \
            --output-directory "$OUTPUT_DIRECTORY"
      - name: Build, prove, transition exact pins and restore admission
        if: env.REFRESH_MODE == 'refresh'
        run: |
          args=(--mode refresh --publish-candidate --prior-history-directory "$HISTORY_DIRECTORY" --output-directory "$OUTPUT_DIRECTORY")
          if [[ -n "$RECOVER_FAILED_NATIVE_JOB" ]]; then
            args+=(--recover-failed-native-job "$RECOVER_FAILED_NATIVE_JOB")
          fi
          if [[ "$RETIRE_EXPIRED_V2" = true ]]; then
            args+=(--retire-expired-v2)
          fi
          if [[ "$RESCUE_EXPIRED_V2" = true ]]; then
            args+=(--rescue-expired-v2)
          fi
          if [[ "$UPGRADE_CURRENT_V2_TO_V3" = true ]]; then
            args+=(--upgrade-current-v2-to-v3)
          fi
          if [[ "$RETIRE_EXPIRED_V2" != true && "$RESCUE_EXPIRED_V2" != true && "$UPGRADE_CURRENT_V2_TO_V3" != true ]]; then
            args+=(--reviewed-application-context --consumed-history-bundle "$CONSUMED_BUNDLE")
          fi
          backend/.venv/bin/python backend/scripts/document_refresh.py "${args[@]}"
      - name: Continue only the exact completed source-native readback
        if: env.REFRESH_MODE == 'full-source-refresh' && env.SOURCE_REVISION == 'true' && env.RESUME_COMPLETED_SOURCE_READBACK == 'true'
        run: |
          backend/.venv/bin/python backend/scripts/resume_completed_document_source.py --mode resume \
            --original-directory "$COMPLETED_SOURCE_ORIGINAL" --consumed-history-bundle "$CONSUMED_BUNDLE" \
            --output-directory "$OUTPUT_DIRECTORY"
      - name: Build full-source inspector, prove native cases and transition exact pins
        if: env.REFRESH_MODE == 'full-source-refresh' && env.RESUME_COMPLETED_SOURCE_READBACK != 'true'
        run: |
          args=(--mode full-source-refresh --publish-candidate --prior-history-directory "$HISTORY_DIRECTORY" --output-directory "$OUTPUT_DIRECTORY")
          if [[ "${SOURCE_REVISION:-false}" = true ]]; then
            args+=(--source-revision --reviewed-application-context --consumed-history-bundle "$CONSUMED_BUNDLE")
          fi
          if [[ -n "$RECOVER_FAILED_NATIVE_JOB" ]]; then
            args+=(--recover-failed-native-job "$RECOVER_FAILED_NATIVE_JOB")
          fi
          backend/.venv/bin/python backend/scripts/document_refresh.py "${args[@]}"
      - name: Retain bounded maintenance evidence
        if: always() && env.OUTPUT_DIRECTORY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-refresh-${{ env.REFRESH_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.OUTPUT_DIRECTORY }}/**/*.json
            !${{ env.OUTPUT_DIRECTORY }}/failure-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
      - name: Retain sanitized failure diagnostics separately from native custody
        if: always() && env.OUTPUT_DIRECTORY != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: document-refresh-diagnostics-${{ env.REFRESH_MODE }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OUTPUT_DIRECTORY }}/failure-diagnostic.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Surface required action
        if: always()
        run: |
          echo '### Document definition maintenance' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$REFRESH_MODE" = resume-final-v2-transition ]]; then
            echo 'The exact failed second continuation, both consumed claims, completed analysis open and API maintenance close are reconciled. A third create-only claim permits only one coordinator open. The original maintenance journal owns API restoration; any unknown outcome requires read-only reconciliation, never replay.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$REFRESH_MODE" = reconcile-final-v2-transition ]]; then
            echo 'This run only reads the exact failed final artifact, third consumed claim, acknowledged coordinator LRO, native proof and live service state. It sends no claim or PATCH. Restore the API only through the original emergency maintenance journal after the retained complete result is independently reviewed.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$REFRESH_MODE" = audit-consumed-v2-history ]]; then
            echo 'This read-only historical audit verifies the exact five-artifact consumed chain, spent claims, original API restoration and fresh current application/document authority. It emits no heartbeat and creates no Build, Job, claim or PATCH. Audit success does not establish refresh completion or natural schedule reliability; inspect the retained result for the actual outcome.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$REFRESH_MODE" = resume-partial-v2-transition ]]; then
