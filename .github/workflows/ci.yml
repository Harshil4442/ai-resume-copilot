name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hirewiz
          POSTGRES_PASSWORD: hirewiz
          POSTGRES_DB: hirewiz_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U hirewiz -d hirewiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node runtime for native HTTP to TypeScript contract checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified official ref
        with:
          node-version: "24"
      - name: Install uv and locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --project backend --frozen --all-groups
      - name: Provision disposable admission test database
        working-directory: backend
        run: |
          .venv/bin/python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE hirewiz_admission_test")
          PY
      - name: Ruff modernized modules
        working-directory: backend
        run: >-
          .venv/bin/ruff check app/domains app/services/guardrails.py app/services/resume_artifacts.py app/services/resume_layout.py app/services/pdf_streams.py app/routers/v1
          app/routers/worker.py app/worker_main.py app/observability.py app/catalog_timing.py app/feature_flags.py app/migrate.py scripts
          tests/test_analysis_runs.py tests/test_career_workspace.py tests/test_alembic_schema.py
          tests/test_usage_guardrails.py tests/test_feature_flags.py tests/test_operations_platform.py
          tests/test_prompt_evaluations.py tests/test_resume_source.py tests/test_resume_source_migrations.py
          tests/test_resume_layout.py tests/test_pdf_streams.py tests/test_docx_parsing.py tests/test_llm_client.py
          tests/test_ai_efficiency.py tests/test_dispatch_outbox.py tests/test_employer_services.py
          tests/test_employer_connectors.py tests/test_employer_artifact_lifecycle.py tests/test_learning_rag_privacy.py
          tests/test_employer_feed_adapters.py tests/test_employer_admissions.py tests/test_employer_admissions_postgres.py
          tests/test_employer_host_pacing.py tests/test_employer_catalog_queries.py
          tests/fixtures/recovery_authority.py tests/test_recovery_authority.py tests/test_recovery_authority_processes.py
          tests/fixtures/recovery_sequence_projection.py tests/test_recovery_sequences.py tests/test_recovery_sequences_processes.py
          tests/test_catalog_timing.py
          tests/fixtures/pairing_authority.py tests/fixtures/firestore_emulator.py tests/test_pairing_crypto.py tests/test_pairing_service.py tests/test_pairing_processes.py
          tests/test_pairing_kms.py tests/test_password_reauth.py
          tests/test_browser_pairing_http.py
          tests/test_job_coverage_audit.py
          tests/test_gcp_rpc.py tests/test_gcp_journal_sdk.py tests/test_gcp_safety_coordinator.py tests/test_gcp_rpc_emulator.py tests/test_gcp_pairing_emulator.py tests/test_gcp_pairing_admission_emulator.py tests/test_gcp_password_reauth_emulator.py
          tests/test_gcp_password_lifetime_emulator.py
          tests/fixtures/gcp_closure.py tests/fixtures/gcp_publication.py
          tests/test_gcp_password_closure_emulator.py tests/test_gcp_publication_emulator.py
          app/domains/recovery/gcp_media.py
          tests/conftest.py tests/model_cost_fixtures.py tests/test_model_cost_budgets.py tests/test_model_cost_budgets_postgres.py
          tests/test_model_cost_liabilities.py tests/test_model_cost_liabilities_postgres.py tests/test_model_cost_result_lifetime_postgres.py
          app/services/model_cost_policy.py app/services/generation_budget.py app/services/llm_client.py app/services/result_commit.py
          app/services/generation_gate.py tests/test_generation_gate.py
          tests/test_monetary_cutover_preflight_postgres.py
          app/routers/candidate_accounts.py app/routers/sensitive_auth.py
          tests/test_sensitive_auth_http.py tests/test_legacy_password_compatibility.py
          tests/test_candidate_account_lifecycle.py tests/test_candidate_legacy_auth_guards.py
          tests/test_candidate_lifetime_migration_postgres.py tests/test_candidate_native_enrollment_emulator.py
          tests/fixtures/gcp_partitioned_publication.py tests/test_candidate_scoped_lifecycle_emulator.py
          tests/test_gcp_partitioned_export_emulator.py tests/test_gcp_partitioned_publication_emulator.py
          tests/test_gcp_publication_scan_emulator.py tests/test_gcp_scoped_authority_emulator.py
          tests/test_gcp_password_reset_emulator.py
          tests/test_monetary_cutover_schema11_postgres.py
          tests/test_migration_logging_postgres.py
          tests/test_fresh_user_no_ai_journey.py
          tests/fixtures/cold_browser_app.py tests/test_cold_browser_runner.py
          ../infra/gcp/release_preflight.py ../tests/test_release_preflight.py
      - name: Check modified legacy authentication imports
        working-directory: backend
        run: .venv/bin/ruff check --select I,F app/routers/auth.py app/security.py app/schemas.py
      - name: Type-check modernized modules
        working-directory: backend
        run: >-
          .venv/bin/mypy app/domains app/services/guardrails.py app/services/resume_artifacts.py app/services/resume_layout.py app/services/pdf_streams.py app/routers/v1
          app/routers/worker.py app/worker_main.py app/observability.py app/catalog_timing.py app/main.py app/security.py app/feature_flags.py app/migrate.py
          app/services/model_cost_policy.py app/services/generation_budget.py app/services/llm_client.py app/services/result_commit.py
          app/services/generation_gate.py
          scripts/monetary_cutover_preflight.py
          app/routers/candidate_accounts.py app/routers/sensitive_auth.py
          ../infra/gcp/release_preflight.py
      - name: Compile backend
        run: backend/.venv/bin/python -m compileall -q backend/app
      - name: Validate PostgreSQL migrations
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_test
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade 20260803_0001
          .venv/bin/alembic upgrade head
      - name: Provision disposable Lever pacing Redis
        id: lever-redis
        timeout-minutes: 3
        run: |
          pacing_container_id="$(docker run --detach --name hirewiz-lever-pacing-20261008 \
            --publish 127.0.0.1:56379:6379 \
            redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 \
            redis-server --save '' --appendonly no --maxmemory-policy noeviction)"
          printf 'container_id=%s\n' "$pacing_container_id" >> "$GITHUB_OUTPUT"
          for pacing_attempt in {1..30}; do
            pacing_response="$(timeout 2s docker exec "$pacing_container_id" redis-cli ping 2>/dev/null || true)"
            if [[ "$pacing_response" == "PONG" ]]; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::Disposable Lever pacing Redis did not become ready after 30 bounded checks.'
          exit 1
      - name: Provision disposable Firestore data emulator
        id: authority-emulator
        working-directory: backend
        timeout-minutes: 3
        run: |
          authority_container_id="$(docker run --detach --name hirewiz-authority-emulator-20261009 \
            --label hirewiz.test=authority-emulator-20261009 \
            --publish 127.0.0.1:58877:8080 --cpus=1 --memory=2g \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --env CLOUDSDK_CONFIG=/tmp/hirewiz-cloudsdk \
            --env CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true --env JAVA_TOOL_OPTIONS=-Xmx1536m --workdir=/tmp \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0-emulators@sha256:1b083a6a9647024a98d4f38c2b51906a0f61ca36adcba11672b8933544962efe \
            gcloud emulators firestore start --project=hirewiz-local-authority \
              --host-port=0.0.0.0:8080 --quiet)"
          printf 'container_id=%s\n' "$authority_container_id" >> "$GITHUB_OUTPUT"
          .venv/bin/python - <<'PY'
          import time
          import grpc
          with grpc.insecure_channel("127.0.0.1:58877") as channel:
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  try:
                      grpc.channel_ready_future(channel).result(timeout=2)
                      print("Disposable localhost Firestore data emulator is ready.")
                      break
                  except grpc.FutureTimeoutError:
                      time.sleep(1)
              else:
                  raise RuntimeError("Disposable localhost Firestore data emulator did not become ready")
          PY
      - name: Run backend tests
        working-directory: backend
        env:
          HIREWIZ_TEST_POSTGRES_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_admission_test
          PAIRING_PASSWORD_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/postgres
          PAIRING_PASSWORD_TEST_POSTGRES_REQUIRED: "true"
          EMPLOYER_PACING_TEST_REDIS_URL: redis://127.0.0.1:56379/0
          HIREWIZ_AUTHORITY_EMULATOR_REQUIRED: "true"
        run: |
          .venv/bin/python scripts/run_prompt_evals.py
          .venv/bin/pytest -q
      - name: Remove disposable Lever pacing Redis
        if: always()
        timeout-minutes: 1
        env:
          PACING_REDIS_CONTAINER_ID: ${{ steps.lever-redis.outputs.container_id }}
        run: |
          if [[ -n "$PACING_REDIS_CONTAINER_ID" ]]; then
            timeout 15s docker rm --force "$PACING_REDIS_CONTAINER_ID"
          fi
      - name: Remove disposable Firestore data emulator
        if: always()
        timeout-minutes: 1
        env:
          AUTHORITY_EMULATOR_CONTAINER_ID: ${{ steps.authority-emulator.outputs.container_id }}
        run: |
          if [[ -n "$AUTHORITY_EMULATOR_CONTAINER_ID" ]]; then
            timeout 15s docker rm --force "$AUTHORITY_EMULATOR_CONTAINER_ID"
          fi
      - name: Check OpenAPI artifact drift
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./openapi-export.db
        run: |
          .venv/bin/python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check generated API client drift
        working-directory: frontend
        run: |
          npm run api:generate
          git diff --exit-code -- lib/generated/api.ts
      - name: Lint, type-check, and test
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Build frontend
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
          NEXTAUTH_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run responsive accessibility smoke tests
        working-directory: frontend
        run: npm run test:e2e

  security-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical
      - name: Scan repository for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4
          detect --source /repo --no-banner --redact
      - name: Build production container
        run: docker build --tag hirewiz-ci:${{ github.sha }} .

  browser-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-companion/package-lock.json
      - name: Install companion test dependencies
        working-directory: browser-companion
        run: npm ci --ignore-scripts
      - name: Check disabled package and protocol regressions
        working-directory: browser-companion
        run: |
          npm run check
          npm test
          npm audit --audit-level=high
      - name: Verify synthetic Razorpay fixture contracts
        working-directory: browser-companion
        run: node --test tests/razorpay-fixture.test.js
      - name: Install Playwright Chromium
        working-directory: browser-companion
        run: npx playwright install --with-deps chromium
      - name: Verify local synthetic MV3 flow
        working-directory: browser-companion
        run: npm run test:browser
      - name: Verify native MV3 connection failure and restart boundaries
        working-directory: browser-companion
        run: npm run test:native-runtime
      - name: Verify synthetic Razorpay browser boundary
        working-directory: browser-companion
        run: node --test tests/razorpay-browser.test.js

  cold-browser-journey:
    # Independent of mocked responsive tests: production Next → real API → PG.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hirewiz
          POSTGRES_PASSWORD: hirewiz
          POSTGRES_DB: hirewiz_admission_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U hirewiz -d hirewiz_admission_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official ref
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified official ref
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified official ref
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install both locked runtimes
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --project backend --frozen --all-groups
          npm ci --ignore-scripts --prefix frontend
      - name: Check journey harness and manual review UI
        run: |
          cd backend
          .venv/bin/ruff check scripts/run_cold_browser_journey.py tests/fixtures/cold_browser_app.py tests/test_cold_browser_runner.py
          .venv/bin/mypy scripts/run_cold_browser_journey.py tests/fixtures/cold_browser_app.py
          .venv/bin/pytest -q tests/test_cold_browser_runner.py
          cd ../frontend
          npx eslint components/EmployerApplicationPanel.tsx journey/cold-no-ai.spec.ts playwright.cold.config.ts
          npm run typecheck
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify complete cold no-AI browser journey
        working-directory: backend
        run: >-
          .venv/bin/python scripts/run_cold_browser_journey.py --allow-disposable-postgres
          --evidence "${{ runner.temp }}/hirewiz-cold-browser-evidence"
      - name: Save sanitized workflow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official ref
        with:
          name: cold-browser-connected-proof
          retention-days: 7
          path: |
            ${{ runner.temp }}/hirewiz-cold-browser-evidence/summary.json
            ${{ runner.temp }}/hirewiz-cold-browser-evidence/manual-handoff-*.png
