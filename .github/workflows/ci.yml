      - name: Check canonical document policy source profiles
        working-directory: backend
        run: .venv/bin/python -I -B -m pytest --noconftest -q tests/test_document_synchronous_do.py::test_canonical_policy_binds_exact_source_and_declares_work_and_reap_bounds
      - name: Configure verified public cache without restarting PostgreSQL
        timeout-minutes: 2
        env:
          CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          [ "$(docker inspect --format '{{.State.Running}} {{.State.Health.Status}}' "$CI_POSTGRES_CONTAINER_ID")" = "true healthy" ]
          postgres_before="$(docker inspect --format '{{.Id}} {{.State.Running}} {{.State.Pid}} {{.State.Health.Status}}' "$CI_POSTGRES_CONTAINER_ID")"
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 backend/scripts/ci_registry_cache.py
          sudo dockerd --validate --config-file /etc/docker/daemon.json
          daemon_pid="$(systemctl show --property=MainPID --value docker)"
          [[ "$daemon_pid" =~ ^[1-9][0-9]*$ ]]
          [ "$daemon_pid" -gt 1 ]
          sudo kill -HUP "$daemon_pid"
          timeout 15s python3 backend/scripts/ci_registry_cache.py --verify
          postgres_after="$(docker inspect --format '{{.Id}} {{.State.Running}} {{.State.Pid}} {{.State.Health.Status}}' "$CI_POSTGRES_CONTAINER_ID")"
          [ "$postgres_before" = "$postgres_after" ]
          docker pull --platform linux/amd64 mirror.gcr.io/library/debian:bookworm-slim@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587
      - name: Build and attest immutable native TeX test compiler
        timeout-minutes: 12
        run: >-
          backend/.venv/bin/python backend/scripts/native_tex_test_image.py
          --platform linux/amd64 --github-env "$GITHUB_ENV"
          --output "$RUNNER_TEMP/native-tex-test-image.json"
      - name: Build and verify genuine native document engines
        timeout-minutes: 20
        env:
          EXPERIMENTAL_BUILDKIT_SOURCE_POLICY: ""
        run: |
          document_source_policy_path="$(python3 backend/scripts/ci_registry_cache.py --document-source-policy)"
          trap 'rm -f -- "$document_source_policy_path"' EXIT
          export EXPERIMENTAL_BUILDKIT_SOURCE_POLICY="$document_source_policy_path"
          document_test_report_path="$RUNNER_TEMP/document-engine-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          backend/.venv/bin/python backend/scripts/document_test_image.py \
            --platform linux/amd64 --source-revision --output "$document_test_report_path"
          printf 'HIREWIZ_DOCUMENT_TEST_REPORT=%s\n' "$document_test_report_path" >> "$GITHUB_ENV"
      - name: Save sanitized native document engine proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official ref
        with:
          name: native-document-engine-proof-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: ${{ runner.temp }}/document-engine-${{ github.run_id }}-${{ github.run_attempt }}.json
      - name: Provision disposable admission test database
        working-directory: backend
        run: |
          .venv/bin/python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE hirewiz_admission_test")
          PY
      - name: Validate PostgreSQL migrations
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_test
        run: |
          # Preserve the original reversible migration rehearsal before the
          # intentionally irreversible evidence/privacy fence is introduced.
          .venv/bin/alembic upgrade 20261028_0025
          .venv/bin/alembic downgrade 20260803_0001
          .venv/bin/alembic upgrade 20261028_0025
          .venv/bin/python - <<'PY'
          from alembic import command
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from sqlalchemy import create_engine, text
          from app.database import DATABASE_URL
          from scripts import evidence_writer_schema26_contract as contract

          configuration = Config("alembic.ini")
          assert ScriptDirectory.from_config(configuration).get_current_head() == contract.SCHEMA
          command.upgrade(configuration, contract.SCHEMA)
          engine = create_engine(DATABASE_URL, hide_parameters=True)
          def snapshot():
              with engine.connect() as connection:
                  observed = contract.observe(connection)
                  fence = connection.execute(text(
                      "SELECT c.oid,c.relowner,c.relacl,t.oid,t.tgenabled,p.oid,p.proowner,p.proacl,"
                      "pg_catalog.pg_get_triggerdef(t.oid),pg_catalog.pg_get_functiondef(p.oid) "
                      "FROM pg_catalog.pg_namespace n JOIN pg_catalog.pg_class c ON c.relnamespace=n.oid "
                      "JOIN pg_catalog.pg_trigger t ON t.tgrelid=c.oid "
                      "JOIN pg_catalog.pg_proc p ON p.oid=t.tgfoid "
                      "WHERE n.nspname='public' AND c.relname='evidence_items' "
                      "AND t.tgname='evidence_writer_fence' AND NOT t.tgisinternal"
                  )).one()
                  return observed, tuple(fence)
          try:
              before = snapshot()
              try:
                  command.downgrade(configuration, "20260803_0001")
              except RuntimeError as error:
                  refusal = (
                      "Evidence writer fence downgrade is unsupported: a reviewed safe replacement "
                      "must retain old-writer denial before this fence can be removed; live privacy "
                      "tokens, outbox deliveries and unknown completion obligations also block safe removal"
                  )
                  assert type(error) is RuntimeError and str(error) == refusal
              else:
                  raise AssertionError("Schema26 downgrade unexpectedly succeeded")
              assert snapshot() == before, "Refused downgrade changed schema26 or its exact evidence fence"
          finally:
              engine.dispose()
          print("Historical25 round trip passed; schema26 refused downgrade with its exact fence unchanged")
          PY
      - name: Provision disposable Lever pacing Redis
        id: lever-redis
        timeout-minutes: 3
        run: |
          pacing_container_id="$(docker run --detach --name hirewiz-lever-pacing-20261008 \
            --publish 127.0.0.1:56379:6379 \
            docker.io/library/redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499 \
            redis-server --save '' --appendonly no --maxmemory-policy noeviction)"
          printf 'container_id=%s\n' "$pacing_container_id" >> "$GITHUB_OUTPUT"
          for pacing_attempt in {1..30}; do
            pacing_response="$(timeout 2s docker exec "$pacing_container_id" redis-cli ping 2>/dev/null || true)"
            if [[ "$pacing_response" == "PONG" ]]; then
              exit 0
            fi
            sleep 1
          done
          echo '::error::Disposable Lever pacing Redis did not become ready after 30 bounded checks.'
          exit 1
      - name: Provision disposable Firestore data emulator
        id: authority-emulator
        working-directory: backend
        timeout-minutes: 3
        run: |
          authority_container_id="$(docker run --detach --name hirewiz-authority-emulator-20261009 \
            --label hirewiz.test=authority-emulator-20261009 \
            --publish 127.0.0.1:58877:8080 --cpus=1 --memory=2g \
            --cap-drop=ALL --security-opt=no-new-privileges \
            --env CLOUDSDK_CONFIG=/tmp/hirewiz-cloudsdk \
            --env CLOUDSDK_CORE_DISABLE_USAGE_REPORTING=true --env JAVA_TOOL_OPTIONS=-Xmx1536m --workdir=/tmp \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:573.0.0-emulators@sha256:1b083a6a9647024a98d4f38c2b51906a0f61ca36adcba11672b8933544962efe \
            gcloud emulators firestore start --project=hirewiz-local-authority \
              --host-port=0.0.0.0:8080 --quiet)"
          printf 'container_id=%s\n' "$authority_container_id" >> "$GITHUB_OUTPUT"
          .venv/bin/python - <<'PY'
          import time
          import grpc
          with grpc.insecure_channel("127.0.0.1:58877") as channel:
              deadline = time.monotonic() + 60
              while time.monotonic() < deadline:
                  try:
                      grpc.channel_ready_future(channel).result(timeout=2)
                      print("Disposable localhost Firestore data emulator is ready.")
                      break
                  except grpc.FutureTimeoutError:
                      time.sleep(1)
              else:
                  raise RuntimeError("Disposable localhost Firestore data emulator did not become ready")
          PY
      - name: Prepare cached native PG17 transfer clients
        id: transfer_clients
        working-directory: backend
        timeout-minutes: 2
        env:
          CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: >-
          .venv/bin/python scripts/ci_database_transfer_clients.py
          --service-container "$CI_POSTGRES_CONTAINER_ID"
          --root "$RUNNER_TEMP/hirewiz-transfer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Qualify retained actual-source schema25 app v1
        working-directory: backend
        env:
          HIREWIZ_TEST_POSTGRES_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_admission_test
          HIREWIZ_APP_COMPATIBILITY_REQUIRED: "true"
        run: .venv/bin/python scripts/qualify_schema25_retained_v1.py
      - name: Qualify schema26 app v3 compatibility
        working-directory: backend
        env:
          HIREWIZ_TEST_POSTGRES_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_admission_test
          HIREWIZ_APP_COMPATIBILITY_REQUIRED: "true"
        run: .venv/bin/python -I -B scripts/qualify_schema26_compatibility.py
      - name: Prepare pinned owned TLS Redis wire binary
        id: native-metadata-redis
        timeout-minutes: 7
        run: |
          test -f /usr/include/openssl/ssl.h
          owned_redis_root="$(mktemp -d "$RUNNER_TEMP/hirewiz-native-wire-redis-XXXXXX")"
          chmod 700 "$owned_redis_root"
          printf 'root=%s\n' "$owned_redis_root" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --max-time 60 --max-filesize 20971520 \
            https://codeload.github.com/redis/redis/tar.gz/refs/tags/7.2.7 \
            --output "$owned_redis_root/source.tgz"
          printf '%s  %s\n' fdbdee0a19a12e61c2eca46f4162f6d3ede3a01e0baa8a12cee1f35f3391f1e9 \
            "$owned_redis_root/source.tgz" | sha256sum --check --status
          mkdir "$owned_redis_root/source"
          tar --no-same-owner --no-same-permissions --strip-components=1 \
            -xzf "$owned_redis_root/source.tgz" -C "$owned_redis_root/source"
          timeout 300s make -C "$owned_redis_root/source" -j2 BUILD_TLS=yes MALLOC=libc redis-server \
            > "$owned_redis_root/build.log" 2>&1
          test -x "$owned_redis_root/source/src/redis-server"
          printf 'binary=%s\n' "$owned_redis_root/source/src/redis-server" >> "$GITHUB_OUTPUT"
      - name: Qualify retained actual-source schema25 app v2
        working-directory: backend
        env:
          HIREWIZ_APP_COMPATIBILITY_REQUIRED: "true"
          HIREWIZ_AUTHORITY_EMULATOR_REQUIRED: "true"
          HIREWIZ_TEST_POSTGRES_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_admission_test
          HIREWIZ_OWNED_REDIS_SERVER: ${{ steps.native-metadata-redis.outputs.binary }}
        run: .venv/bin/python scripts/qualify_schema25_retained_v2.py
      - name: Qualify schema26 app v3 native protocol
        working-directory: backend
        env:
          HIREWIZ_APP_COMPATIBILITY_REQUIRED: "true"
          HIREWIZ_AUTHORITY_EMULATOR_REQUIRED: "true"
          HIREWIZ_TEST_POSTGRES_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_admission_test
          HIREWIZ_OWNED_REDIS_SERVER: ${{ steps.native-metadata-redis.outputs.binary }}
        run: .venv/bin/python -I -B -m pytest --noconftest -q tests/test_schema25_app_protocol_v3.py
      - name: Run backend tests
        working-directory: backend
        env:
          PYTEST_ADDOPTS: "--durations=50"
          CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
          HIREWIZ_TEST_POSTGRES_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_admission_test
          HIREWIZ_TRANSFER_POSTGRES_REQUIRED: "true"
          PAIRING_PASSWORD_TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/postgres
          PAIRING_PASSWORD_TEST_POSTGRES_REQUIRED: "true"
          EMPLOYER_PACING_TEST_REDIS_URL: redis://127.0.0.1:56379/0
          HIREWIZ_AUTHORITY_EMULATOR_REQUIRED: "true"
          HIREWIZ_OWNED_REDIS_SERVER: ${{ steps.native-metadata-redis.outputs.binary }}
          HIREWIZ_CI_LOCK_DIAGNOSTICS: "1"
        run: |
          .venv/bin/python scripts/run_prompt_evals.py
          .venv/bin/python -I -B isolated_checks/test_document_service_reap.py
          .venv/bin/python -I -B tests/native_tex_subreaper_linux_probe.py \
            --worker ../infra/native-tex/cloud_service.py \
            --owned ../infra/document-processing/service.py
          # Catch the native delivery/application contract before the full suite.
          .venv/bin/pytest -q -p scripts.ci_postgres_lock_diagnostics tests/test_analysis_runs.py::test_evidence_tailoring_creates_a_traceable_version_and_commits_once
          .venv/bin/pytest -q -p scripts.ci_postgres_lock_diagnostics --ignore=tests/test_schema25_app_compatibility_v2_postgres.py --ignore=tests/test_schema25_app_rolling_v2.py --ignore=tests/test_schema25_app_alias_retirement.py --ignore=tests/test_schema25_app_protocol_v2.py
      - name: Save encrypted PostgreSQL failure diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official ref
        with:
          name: encrypted-postgres-lock-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: ${{ runner.temp }}/hirewiz-ci-pg-lock-${{ github.run_id }}-${{ github.run_attempt }}/failure.enc
      - name: Remove only owned transfer client containers
        if: ${{ always() && contains(fromJSON('["success","failure","cancelled"]'), steps.transfer_clients.outcome) }}
        working-directory: backend
        timeout-minutes: 1
        env:
          CI_POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: >-
          .venv/bin/python scripts/ci_database_transfer_clients.py --cleanup
          --service-container "$CI_POSTGRES_CONTAINER_ID"
          --root "$RUNNER_TEMP/hirewiz-transfer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Remove disposable Lever pacing Redis
        if: always()
        timeout-minutes: 1
        env:
          PACING_REDIS_CONTAINER_ID: ${{ steps.lever-redis.outputs.container_id }}
        run: |
          if [[ -n "$PACING_REDIS_CONTAINER_ID" ]]; then
            timeout 15s docker rm --force "$PACING_REDIS_CONTAINER_ID"
          fi
      - name: Remove disposable Firestore data emulator
        if: always()
        timeout-minutes: 1
        env:
          AUTHORITY_EMULATOR_CONTAINER_ID: ${{ steps.authority-emulator.outputs.container_id }}
        run: |
          if [[ -n "$AUTHORITY_EMULATOR_CONTAINER_ID" ]]; then
            timeout 15s docker rm --force "$AUTHORITY_EMULATOR_CONTAINER_ID"
          fi
      - name: Remove only owned TLS Redis build source
        if: always()
        timeout-minutes: 1
        env:
          NATIVE_WIRE_REDIS_ROOT: ${{ steps.native-metadata-redis.outputs.root }}
        run: |
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          raw = os.environ.get("NATIVE_WIRE_REDIS_ROOT", "")
          if raw:
              root = Path(raw)
              assert root.parent == Path(os.environ["RUNNER_TEMP"]).resolve()
              assert root.name.startswith("hirewiz-native-wire-redis-")
              assert root.resolve() == root and not root.is_symlink()
              assert root.stat().st_uid == os.getuid()
              shutil.rmtree(root)
          PY
      - name: Check OpenAPI artifact drift
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./openapi-export.db
        run: |
          .venv/bin/python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check generated API client drift
        working-directory: frontend
        run: |
          npm run api:generate
          git diff --exit-code -- lib/generated/api.ts
      - name: Lint, type-check, and test
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Build frontend
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
          NEXTAUTH_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run responsive accessibility smoke tests
        working-directory: frontend
        run: npm run test:e2e

  security-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical
      - name: Configure verified public cache before security Docker operations
        timeout-minutes: 2
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_OS python3 backend/scripts/ci_registry_cache.py
          sudo dockerd --validate --config-file /etc/docker/daemon.json
          daemon_pid="$(systemctl show --property=MainPID --value docker)"
          [[ "$daemon_pid" =~ ^[1-9][0-9]*$ ]]
          [ "$daemon_pid" -gt 1 ]
          sudo kill -HUP "$daemon_pid"
          timeout 15s python3 backend/scripts/ci_registry_cache.py --verify
      - name: Scan repository for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4
          detect --source /repo --no-banner --redact --gitleaks-ignore-path /repo/.gitleaksignore.catalogue
      - name: Build production container
        run: docker build --tag hirewiz-ci:${{ github.sha }} .

  browser-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-companion/package-lock.json
      - name: Python runtime for the installed extension's SQL and cryptographic bridge
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified official ref
        with:
          python-version: "3.12"
      - name: Install locked backend dependencies for reviewed browser assistance
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --project backend --frozen --all-groups
      - name: Install companion test dependencies
        working-directory: browser-companion
        run: npm ci --ignore-scripts
      - name: Check companion permissions and protocol regressions
        working-directory: browser-companion
        run: |
          npm run check
          npm test
          npm audit --audit-level=high
      - name: Verify the public download matches the reviewed extension source
        run: python browser-companion/scripts/package-reviewed.py --check
      - name: Verify synthetic Razorpay fixture contracts
        working-directory: browser-companion
        run: node --test tests/razorpay-fixture.test.js
      - name: Install Playwright Chromium
        working-directory: browser-companion
        run: npx playwright install --with-deps chromium
      - name: Verify local synthetic MV3 flow
        working-directory: browser-companion
        run: npm run test:browser
      - name: Verify native MV3 connection failure and restart boundaries
        working-directory: browser-companion
        run: npm run test:native-runtime
      - name: Verify synthetic Razorpay browser boundary
        working-directory: browser-companion
        run: node --test tests/razorpay-browser.test.js
      - name: Verify installed reviewed assistance against the actual SQL and cryptographic bridge
        working-directory: browser-companion
        run: npm run test:assistance

  cold-browser-journey:
    # Independent of mocked responsive tests: production Next → real API → PG.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: hirewiz
          POSTGRES_PASSWORD: hirewiz
          POSTGRES_DB: hirewiz_admission_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U hirewiz -d hirewiz_admission_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified official ref
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified official ref
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified official ref
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install both locked runtimes
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --project backend --frozen --all-groups
          npm ci --ignore-scripts --prefix frontend
      - name: Check journey harness and manual review UI
        run: |
          cd backend
          .venv/bin/ruff check scripts/run_cold_browser_journey.py tests/fixtures/cold_browser_app.py tests/fixtures/cold_browser_credit_policy.py tests/test_cold_browser_runner.py
          .venv/bin/mypy scripts/run_cold_browser_journey.py tests/fixtures/cold_browser_app.py tests/fixtures/cold_browser_credit_policy.py
          .venv/bin/pytest -q tests/test_cold_browser_runner.py
          cd ../frontend
          npx eslint components/EmployerApplicationPanel.tsx journey/cold-no-ai.spec.ts journey/cold-unified-discovery.spec.ts playwright.cold.config.ts
          npm run typecheck
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify legacy order recovery browser journey
        working-directory: backend
        run: >-
          .venv/bin/python scripts/run_cold_browser_journey.py --allow-disposable-postgres
          --scenario legacy
          --evidence "${{ runner.temp }}/hirewiz-cold-browser-evidence"
      - name: Verify unified credit purchase and discovery browser journey
        working-directory: backend
        run: >-
          .venv/bin/python scripts/run_cold_browser_journey.py --allow-disposable-postgres
          --scenario unified
          --evidence "${{ runner.temp }}/hirewiz-unified-browser-evidence"
      - name: Save sanitized workflow evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, verified official ref
        with:
          name: cold-browser-connected-proof
          retention-days: 7
          path: |
            ${{ runner.temp }}/hirewiz-cold-browser-evidence/summary.json
            ${{ runner.temp }}/hirewiz-cold-browser-evidence/manual-handoff-*.png
            ${{ runner.temp }}/hirewiz-unified-browser-evidence/summary.json
