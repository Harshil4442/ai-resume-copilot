name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: hirewiz
          POSTGRES_PASSWORD: hirewiz
          POSTGRES_DB: hirewiz_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U hirewiz -d hirewiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The additive-schema rollback rehearsal imports the actual prior app.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Node runtime for native HTTP to TypeScript contract checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, verified official ref
        with:
          node-version: "24"
      - name: Install uv and locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --project backend --frozen --all-groups
      - name: Verify deployment source pin before native builds
        working-directory: backend
        run: .venv/bin/python -I -B -m pytest --noconftest -q tests/test_nologin_role_source_pin.py
      - name: Ruff modernized modules
        working-directory: backend
        run: >-
          .venv/bin/ruff check app/domains app/services/guardrails.py app/services/resume_artifacts.py app/services/resume_layout.py app/services/pdf_streams.py app/routers/v1
          app/routers/worker.py app/worker_main.py app/observability.py app/catalog_timing.py app/feature_flags.py app/migrate.py scripts
          tests/native_tex_ci_fixtures.py tests/native_docx_ci_fixtures.py tests/test_native_tex_ci.py tests/test_native_tex.py
          tests/test_native_tex_r2.py tests/test_native_tex_application.py
