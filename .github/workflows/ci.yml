name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: hirewiz
          POSTGRES_PASSWORD: hirewiz
          POSTGRES_DB: hirewiz_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U hirewiz -d hirewiz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and locked dependencies
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.32
          uv sync --project backend --frozen --all-groups
      - name: Provision disposable admission test database
        working-directory: backend
        run: |
          .venv/bin/python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_test", autocommit=True) as connection:
              connection.execute("CREATE DATABASE hirewiz_admission_test")
          PY
      - name: Ruff modernized modules
        working-directory: backend
        run: >-
          .venv/bin/ruff check app/domains app/services/guardrails.py app/services/resume_artifacts.py app/services/resume_layout.py app/services/pdf_streams.py app/routers/v1
          app/routers/worker.py app/worker_main.py app/observability.py app/feature_flags.py app/migrate.py scripts
          tests/test_analysis_runs.py tests/test_career_workspace.py tests/test_alembic_schema.py
          tests/test_usage_guardrails.py tests/test_feature_flags.py tests/test_operations_platform.py
          tests/test_prompt_evaluations.py tests/test_resume_source.py tests/test_resume_source_migrations.py
          tests/test_resume_layout.py tests/test_pdf_streams.py tests/test_docx_parsing.py tests/test_llm_client.py
          tests/test_ai_efficiency.py tests/test_dispatch_outbox.py tests/test_employer_services.py
          tests/test_employer_connectors.py tests/test_employer_artifact_lifecycle.py tests/test_learning_rag_privacy.py
          tests/test_employer_feed_adapters.py tests/test_employer_admissions.py tests/test_employer_admissions_postgres.py
      - name: Type-check modernized modules
        working-directory: backend
        run: >-
          .venv/bin/mypy app/domains app/services/guardrails.py app/services/resume_artifacts.py app/services/resume_layout.py app/services/pdf_streams.py app/routers/v1
          app/routers/worker.py app/worker_main.py app/observability.py app/feature_flags.py app/migrate.py
      - name: Compile backend
        run: backend/.venv/bin/python -m compileall -q backend/app
      - name: Validate PostgreSQL migrations
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_test
        run: |
          .venv/bin/alembic upgrade head
          .venv/bin/alembic downgrade 20260803_0001
          .venv/bin/alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        env:
          HIREWIZ_TEST_POSTGRES_URL: postgresql+psycopg://hirewiz:hirewiz@127.0.0.1:55433/hirewiz_admission_test
        run: |
          .venv/bin/python scripts/run_prompt_evals.py
          .venv/bin/pytest -q
      - name: Check OpenAPI artifact drift
        working-directory: backend
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./openapi-export.db
        run: |
          .venv/bin/python scripts/export_openapi.py
          git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check generated API client drift
        working-directory: frontend
        run: |
          npm run api:generate
          git diff --exit-code -- lib/generated/api.ts
      - name: Lint, type-check, and test
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm test
      - name: Build frontend
        working-directory: frontend
        env:
          NEXTAUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
          NEXTAUTH_URL: http://127.0.0.1:3000
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run responsive accessibility smoke tests
        working-directory: frontend
        run: npm run test:e2e

  security-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=critical
      - name: Scan repository for committed secrets
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2
          detect --source /repo --no-banner --redact
      - name: Build production container
        run: docker build --tag hirewiz-ci:${{ github.sha }} .

  browser-companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: browser-companion/package-lock.json
      - name: Install companion test dependencies
        working-directory: browser-companion
        run: npm ci --ignore-scripts
      - name: Check disabled package and protocol regressions
        working-directory: browser-companion
        run: |
          npm run check
          npm test
          npm audit --audit-level=high
      - name: Install Playwright Chromium
        working-directory: browser-companion
        run: npx playwright install --with-deps chromium
      - name: Verify local synthetic MV3 flow
        working-directory: browser-companion
        run: npm run test:browser
