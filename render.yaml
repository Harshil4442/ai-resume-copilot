services:
  - type: web
    name: ai-resume-copilot
    env: docker
    plan: starter
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGINS
        value: https://www.hirewizhq.com
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_MODE
        value: live
      - key: RAZORPAY_CHECKOUT_ENABLED
        value: "false"
      - key: RAZORPAY_ACCOUNT_APPROVED
        value: "false"
      - key: PAYMENTS_GO_LIVE_REVIEW_COMPLETE
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
